<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SSM: The 1.37 Billion Year Big Bang — Crystallization Wavefront</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;}
html,body{width:100%;height:100%;overflow:hidden;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:#fff;}
#wrap{display:flex;flex-direction:column;width:100%;height:100%;}
#hd{padding:5px 12px;border-bottom:1px solid #ddd;background:#f8f8f8;flex-shrink:0;display:flex;align-items:center;gap:10px;}
#badge{font-size:10px;font-weight:700;color:#fff;padding:2px 8px;border-radius:3px;letter-spacing:0.4px;}
#title{font-size:13px;font-weight:700;color:#222;}
#cv{flex:1;display:block;min-height:0;}
#desc{position:absolute;bottom:46px;left:10px;max-width:440px;background:rgba(255,255,255,0.96);color:#333;padding:9px 13px;border-radius:7px;font-size:11.5px;line-height:1.65;border:1px solid #ddd;pointer-events:none;}
#desc b{color:#111;}
.cb{color:#0077BB;}.cr{color:#CC3311;}.cg{color:#009988;}.co{color:#EE7733;}.cy{color:#996600;}.cp{color:#AA3377;}
#eq{position:absolute;bottom:46px;right:10px;background:rgba(255,255,255,0.96);color:#222;padding:7px 13px;border-radius:7px;font-size:12px;font-family:'Courier New',monospace;border:1px solid #ddd;pointer-events:none;text-align:right;line-height:1.7;}
#ct{flex-shrink:0;padding:5px 10px;background:#f8f8f8;border-top:1px solid #ddd;display:flex;gap:4px;align-items:center;justify-content:center;}
.btn{padding:4px 10px;border:1px solid #ccc;border-radius:3px;background:#fff;color:#555;cursor:pointer;font-size:11px;font-family:inherit;}
.btn.on{border-color:#0077BB;background:#e6f2ff;color:#005588;font-weight:600;}
#sl{flex:1;max-width:350px;margin:0 8px;}
#sl input{width:100%;}
#fc{font-size:10px;color:#888;min-width:40px;text-align:right;}
</style>
</head>
<body>
<div id="wrap">
<div id="hd">
<span id="badge" style="background:#CC3311;">ORIGIN</span>
<div id="title">Loading...</div>
</div>
<div style="flex:1;position:relative;min-height:0;">
<canvas id="cv"></canvas>
<div id="desc"></div>
<div id="eq"></div>
</div>
<div id="ct">
<button class="btn" onclick="goS()">⏮</button>
<button class="btn" onclick="goP()">◀</button>
<button class="btn on" id="bp" onclick="togPlay()">▶ Play</button>
<button class="btn" onclick="goN()">▶</button>
<button class="btn" onclick="goE()">⏭</button>
<div id="sl"><input type="range" min="0" max="0" value="0" oninput="goTo(+this.value)"></div>
<span id="fc">1/6</span>
<button class="btn on" id="br" onclick="togR()">Rot</button>
</div>
</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(function(){"use strict";
var canvas=document.getElementById("cv");
var W,H2,scene,camera,renderer,group;
var rot={x:0.15,y:0},md=false,mx=0,my=0,ar=true;

function init(){var p=canvas.parentElement;W=p.clientWidth;H2=p.clientHeight;canvas.width=W;canvas.height=H2;
scene=new THREE.Scene();scene.background=new THREE.Color(0xffffff);
camera=new THREE.PerspectiveCamera(42,W/H2,0.1,300);
renderer=new THREE.WebGLRenderer({canvas:canvas,antialias:true});renderer.setSize(W,H2);renderer.setPixelRatio(Math.min(window.devicePixelRatio,2));
scene.add(new THREE.AmbientLight(0xffffff,0.45));
var dl=new THREE.DirectionalLight(0xffffff,0.55);dl.position.set(5,8,6);scene.add(dl);
scene.add(new THREE.DirectionalLight(0x8888cc,0.15)).position.set(-4,-3,-5);
group=new THREE.Group();scene.add(group);}
init();

canvas.addEventListener("mousedown",function(e){md=true;mx=e.clientX;my=e.clientY;});
canvas.addEventListener("touchstart",function(e){md=true;mx=e.touches[0].clientX;my=e.touches[0].clientY;},{passive:true});
window.addEventListener("mouseup",function(){md=false;});window.addEventListener("touchend",function(){md=false;});
window.addEventListener("mousemove",function(e){if(!md)return;rot.y+=(e.clientX-mx)*0.005;rot.x+=(e.clientY-my)*0.005;rot.x=Math.max(-1.4,Math.min(1.4,rot.x));mx=e.clientX;my=e.clientY;});
window.addEventListener("touchmove",function(e){if(!md)return;var t2=e.touches[0];rot.y+=(t2.clientX-mx)*0.005;rot.x+=(t2.clientY-my)*0.005;rot.x=Math.max(-1.4,Math.min(1.4,rot.x));mx=t2.clientX;my=t2.clientY;},{passive:true});
canvas.addEventListener("wheel",function(e){camera.position.z=Math.max(4,Math.min(30,camera.position.z+e.deltaY*0.03));e.preventDefault();},{passive:false});
window.addEventListener("resize",function(){var p=canvas.parentElement;W=p.clientWidth;H2=p.clientHeight;canvas.width=W;canvas.height=H2;camera.aspect=W/H2;camera.updateProjectionMatrix();renderer.setSize(W,H2);});

var CL={b:0x0077BB,or:0xEE7733,tl:0x009988,rd:0xCC3311,gn:0x22AA44,wn:0xAA3377,gy:0x999999,lgy:0xcccccc,yl:0xEECC00};

function mS(g,p,r,c,op){var geo=new THREE.SphereGeometry(r,20,20);var m=new THREE.MeshPhongMaterial({color:c,transparent:op<1,opacity:op,side:THREE.DoubleSide});var s=new THREE.Mesh(geo,m);s.position.set(p[0],p[1],p[2]);g.add(s);return s;}
function mL(g,t,p,c,sz){var cv2=document.createElement("canvas");cv2.width=768;cv2.height=96;var ctx=cv2.getContext("2d");ctx.font="bold "+(sz||32)+"px -apple-system,sans-serif";ctx.fillStyle=c;ctx.textAlign="center";ctx.textBaseline="middle";ctx.fillText(t,384,48);var tx=new THREE.CanvasTexture(cv2);var s=new THREE.Sprite(new THREE.SpriteMaterial({map:tx,transparent:true}));s.position.set(p[0],p[1],p[2]);s.scale.set(sz?sz*0.06:2.0,sz?sz*0.009:0.28,1);g.add(s);return s;}
function mRing(g,r,c,op,y){var geo=new THREE.RingGeometry(r-0.03,r+0.03,64);var m=new THREE.MeshBasicMaterial({color:c,transparent:true,opacity:op,side:THREE.DoubleSide});var s=new THREE.Mesh(geo,m);s.rotation.x=Math.PI/2;s.position.y=y||0;g.add(s);return s;}
function mArrow(g,from,to,c,op){var d=new THREE.Vector3(to[0]-from[0],to[1]-from[1],to[2]-from[2]);var l=d.length();var mid=new THREE.Vector3((from[0]+to[0])/2,(from[1]+to[1])/2,(from[2]+to[2])/2);var geo=new THREE.CylinderGeometry(0.03,0.03,l,5);var m=new THREE.MeshPhongMaterial({color:c,transparent:op<1,opacity:op});var s=new THREE.Mesh(geo,m);s.position.copy(mid);s.quaternion.setFromUnitVectors(new THREE.Vector3(0,1,0),d.normalize());g.add(s);
// Arrowhead
var ah=new THREE.CylinderGeometry(0,0.1,0.2,8);var am=new THREE.MeshPhongMaterial({color:c,transparent:op<1,opacity:op});var as2=new THREE.Mesh(ah,am);as2.position.set(to[0],to[1],to[2]);as2.quaternion.setFromUnitVectors(new THREE.Vector3(0,1,0),d.normalize());g.add(as2);}

var R=3.5; // observable universe radius

// ============= STEPS =============
var steps=[];

// S0: The singular origin
steps.push({cam:[0,0,12],bg:0xffffff,badge:"THE ORIGIN",bc:"#CC3311",
title:"A Single Nucleation Event: The Absolute Cosmic Origin",
build:function(g){
  // Origin point — bright, pulsing
  mS(g,[0,0,0],0.25,CL.rd,1);
  var glow=new THREE.SphereGeometry(0.4,16,16);
  var gm=new THREE.MeshBasicMaterial({color:CL.rd,transparent:true,opacity:0.15});
  var gl=new THREE.Mesh(glow,gm);g.add(gl);
  g.userData.glows=[gl];
  // Expanding rings to suggest propagation
  for(var i=1;i<=4;i++){
    mRing(g,i*0.8,CL.rd,0.15-i*0.03);
  }
  mL(g,"ORIGIN",[0,0.7,0],"#CC3311",30);
  mL(g,"Single nucleation event",[0,-0.6,0],"#CC3311",22);
  mL(g,"Not simultaneous",[0,-1.8,0],"#333333",22);
  mL(g,"Not multiple bubbles",[0,-2.3,0],"#333333",22);
  mL(g,"One point. One wavefront.",[0,-2.9,0],"#CC3311",24);
},
desc:'<b>The origin.</b> In the SSM, the Big Bang is not a simultaneous global event. It is a <b>single nucleation event</b> at one point. The entire observable universe traces back to this one origin, propagating outward as a crystallization wavefront.',
eq:''});

// S1: Two speeds — 2D causal front vs 3D lock-in
steps.push({cam:[0,0,14],bg:0xffffff,badge:"TWO SPEEDS",bc:"#0077BB",
title:"Two Fronts: 2D Causal Boundary (v = c) vs 3D Crystallization (v = pc)",
build:function(g){
  // Origin
  mS(g,[0,0,0],0.15,CL.rd,0.8);
  // 2D causal front — large, fast, blue
  var causalR=R*1.3;
  var cGeo=new THREE.SphereGeometry(causalR,32,32);
  var cMat=new THREE.MeshBasicMaterial({color:CL.b,transparent:true,opacity:0.06,side:THREE.DoubleSide});
  g.add(new THREE.Mesh(cGeo,cMat));
  mRing(g,causalR,CL.b,0.3);
  mL(g,"2D causal front",[causalR+0.8,0.5,0],"#0077BB",20);
  mL(g,"v = c",[causalR+0.5,-0.1,0],"#0077BB",22);
  // 3D crystallization front — smaller, trailing, orange
  var crystR=causalR*0.3; // ~p fraction but visually exaggerated for clarity
  var crGeo=new THREE.SphereGeometry(crystR,32,32);
  var crMat=new THREE.MeshPhongMaterial({color:CL.or,transparent:true,opacity:0.2,side:THREE.DoubleSide});
  g.add(new THREE.Mesh(crGeo,crMat));
  mRing(g,crystR,CL.or,0.5);
  mL(g,"3D lock-in",[crystR+0.7,0.4,0],"#EE7733",20);
  mL(g,"v = p\u00D7c \u2248 c/20",[crystR+0.7,-0.15,0],"#EE7733",22);
  // Gap annotation
  mArrow(g,[crystR+0.1,1.5,0],[causalR-0.1,1.5,0],CL.gy,0.5);
  mL(g,"thermal equilibration zone",[((crystR+causalR)/2),1.9,0],"#888888",16);
  mL(g,"(resolves horizon problem)",[((crystR+causalR)/2),1.55,0],"#888888",14);
  // Bottom labels
  mL(g,"The 3D crystallization trails at \u2248 1/20th the speed of light",[0,-2.5,0],"#333333",20);
  mL(g,"p = e\u207B\u00B3 \u2248 0.0498",[0,-3.0,0],"#EE7733",22);
},
desc:'<b>Two propagation speeds.</b> The <span class="cb">2D causal front</span> (blue) races outward at the speed of light c = S_trans \u00D7 v_lattice = 4v_lattice. This IS c \u2014 the maximum signal speed defines the causal boundary and provides thermal equilibration. The <span class="co">3D crystallization</span> (orange) trails at p\u00D7c \u2248 c/20 because the K=4\u2192K=12 transition requires c=3 simultaneous bond flips (probability e\u207B\u00B3). The gap between them is the age gradient\u2019s origin.',
eq:'v_front = c (causal)\nv_3D = p \u00D7 c \u2248 c/20\n\np = e\u207B\u00B3 \u2248 0.0498\n\nc \u226B v_3D'});

// S2: Wavefront sweeping through the observable universe
steps.push({cam:[0,0,14],bg:0xffffff,badge:"THE WAVEFRONT",bc:"#EE7733",
title:"The Crystallization Wavefront Sweeps Across the Observable Universe",
build:function(g){
  // Observable universe outline
  var outerGeo=new THREE.SphereGeometry(R,32,32);
  var outerMat=new THREE.MeshBasicMaterial({color:CL.gy,transparent:true,opacity:0.05,side:THREE.DoubleSide});
  g.add(new THREE.Mesh(outerGeo,outerMat));
  mRing(g,R,CL.gy,0.2);
  // Origin — off to the left
  mS(g,[-R-1.5,0,0],0.12,CL.rd,0.8);
  mL(g,"ORIGIN",[-R-1.5,0.5,0],"#CC3311",16);
  // Wavefront sweeping direction arrow
  mArrow(g,[-R-0.5,0,0],[R+0.5,0,0],CL.or,0.4);
  mL(g,"wavefront direction",[0,-0.5,0],"#EE7733",16);
  // Animated wavefront plane (vertical disc sweeping left to right)
  var wfGeo=new THREE.CircleGeometry(R*1.1,32);
  var wfMat=new THREE.MeshBasicMaterial({color:CL.or,transparent:true,opacity:0.15,side:THREE.DoubleSide});
  var wf=new THREE.Mesh(wfGeo,wfMat);
  wf.rotation.y=Math.PI/2;
  g.add(wf);
  g.userData.wavefront=wf;
  // Older hemisphere label (left)
  mL(g,"OLDER",[-R*0.55,R+0.8,0],"#CC3311",24);
  mL(g,"crystallized first",[-R*0.55,R+0.35,0],"#CC3311",16);
  mL(g,"14.49 Gyr",[-R*0.55,R-0.05,0],"#CC3311",20);
  // Younger hemisphere label (right)
  mL(g,"YOUNGER",[R*0.55,R+0.8,0],"#0077BB",24);
  mL(g,"crystallized last",[R*0.55,R+0.35,0],"#0077BB",16);
  mL(g,"13.11 Gyr",[R*0.55,R-0.05,0],"#0077BB",20);
  // Observer at centre
  mS(g,[0,0,0],0.12,CL.gn,1);
  mL(g,"Observer",[0,0.45,0],"#22AA44",18);
  mL(g,"(sees both hemispheres)",[0,-1.0,0],"#888888",14);
  // Colour the two halves
  // Left half (older) — warm red
  var halfL=new THREE.SphereGeometry(R,32,32,Math.PI,Math.PI);
  var halfLM=new THREE.MeshPhongMaterial({color:0xCC3311,transparent:true,opacity:0.08,side:THREE.DoubleSide});
  var hlMesh=new THREE.Mesh(halfL,halfLM);
  hlMesh.rotation.y=-Math.PI/2;
  g.add(hlMesh);
  // Right half (younger) — cool blue
  var halfR=new THREE.SphereGeometry(R,32,32,Math.PI,Math.PI);
  var halfRM=new THREE.MeshPhongMaterial({color:0x0077BB,transparent:true,opacity:0.08,side:THREE.DoubleSide});
  var hrMesh=new THREE.Mesh(halfR,halfRM);
  hrMesh.rotation.y=Math.PI/2;
  g.add(hrMesh);
  mL(g,"\u0394t = 1.37 Gyr",[0,-R-0.6,0],"#996600",24);
},
desc:'<b>The wavefront sweeps through.</b> The crystallization front (orange plane) swept past our position from left to right. The <span class="cr">older hemisphere</span> (left, red) crystallized first \u2014 14.49 Gyr ago. The <span class="cb">younger hemisphere</span> (right, blue) crystallized last \u2014 13.11 Gyr ago. The <span class="cg">observer</span> (green) sits at the midpoint, averaging to the measured 13.80 Gyr.',
eq:'t_older = 14.49 Gyr\nt_younger = 13.11 Gyr\n\n\u0394t = 1.37 Gyr\nt_avg = 13.80 Gyr'});

// S3: The age gradient mapped on the sphere
steps.push({cam:[0,0,13],bg:0xffffff,badge:"AGE GRADIENT",bc:"#996600",
title:"The Permanent Age Gradient Across the Observable Universe",
build:function(g){
  // Build sphere with longitudinal colour gradient (red → blue)
  var nSlices=24;
  for(var i=0;i<nSlices;i++){
    var frac=i/(nSlices-1); // 0=left(old) to 1=right(young)
    var theta0=(i/nSlices)*Math.PI;
    var theta1=((i+1)/nSlices)*Math.PI;
    var sliceGeo=new THREE.SphereGeometry(R,32,32,theta0,theta1-theta0+0.01);
    var r2=Math.floor(204*(1-frac)+0*frac);
    var g2=Math.floor(51*(1-frac)+119*frac);
    var b2=Math.floor(17*(1-frac)+187*frac);
    var col=new THREE.Color("rgb("+r2+","+g2+","+b2+")");
    var sliceMat=new THREE.MeshPhongMaterial({color:col,transparent:true,opacity:0.25,side:THREE.DoubleSide});
    var sm=new THREE.Mesh(sliceGeo,sliceMat);
    sm.rotation.y=-Math.PI/2;
    g.add(sm);
  }
  // Gradient bar labels
  mL(g,"14.49 Gyr",[-R-0.8,0,0],"#CC3311",20);
  mL(g,"13.80 Gyr",[0,-R-0.5,0],"#996600",20);
  mL(g,"13.11 Gyr",[R+0.8,0,0],"#0077BB",20);
  // Arrow along gradient
  mArrow(g,[-R+0.3,R+0.3,0],[R-0.3,R+0.3,0],CL.gy,0.3);
  mL(g,"crystallization direction",[0,R+0.7,0],"#888888",16);
  // Origin pointer
  mArrow(g,[-R-0.3,0.8,0],[-R-1.5,0.8,0],CL.rd,0.5);
  mL(g,"\u2190 toward origin",[-R-1.8,0.4,0],"#CC3311",16);
  // Observer
  mS(g,[0,0,0],0.1,CL.gn,1);
  mL(g,"\u0394t/t\u2080 = 2e\u207B\u00B3 \u2248 10%",[0,-R-1.1,0],"#996600",24);
},
desc:'<b>The age gradient.</b> The observable universe is colour-coded from <span class="cr">old (red, 14.49 Gyr)</span> to <span class="cb">young (blue, 13.11 Gyr)</span>. This is not a temperature difference \u2014 it is a <b>structural age difference</b>. The gradient direction always points back toward the absolute cosmic origin. Every observer measures the same 10% fractional gradient; only the direction varies.',
eq:'\u0394t/t\u2080 = 2p = 2e\u207B\u00B3\n\u2248 0.0996 \u2248 10%\n\nScale-free,\nepoch-independent,\nuniversal'});

// S4: CMB dipole comparison
steps.push({cam:[0,0,13],bg:0xfafafa,badge:"CMB DIPOLE",bc:"#AA3377",
title:"Predicted vs Observed CMB Hemispherical Asymmetry",
build:function(g){
  // Two-hemisphere sphere
  var halfL2=new THREE.SphereGeometry(R,32,32,Math.PI,Math.PI);
  var halfLM2=new THREE.MeshPhongMaterial({color:0xCC3311,transparent:true,opacity:0.15,side:THREE.DoubleSide});
  var hlM2=new THREE.Mesh(halfL2,halfLM2);hlM2.rotation.y=-Math.PI/2;g.add(hlM2);
  var halfR2=new THREE.SphereGeometry(R,32,32,Math.PI,Math.PI);
  var halfRM2=new THREE.MeshPhongMaterial({color:0x0077BB,transparent:true,opacity:0.15,side:THREE.DoubleSide});
  var hrM2=new THREE.Mesh(halfR2,halfRM2);hrM2.rotation.y=Math.PI/2;g.add(hrM2);
  // Comparison panel (3D text)
  mL(g,"\u039BCDM predicts: A = 0.000",[0,R+1.5,0],"#888888",22);
  mL(g,"SSM predicts:  A = 0.049",[0,R+1.0,0],"#AA3377",22);
  mL(g,"Planck observes: A = 0.066 \u00B1 0.021",[0,R+0.5,0],"#333333",24);
  // Tension labels
  mL(g,"\u039BCDM: > 3\u03C3 EXCLUDED",[-R*0.6,-R-0.5,0],"#CC3311",22);
  mL(g,"SSM: within 1\u03C3 (0.8\u03C3)",[R*0.6,-R-0.5,0],"#22AA44",22);
  // A = p derivation
  mL(g,"A = \u0394T/T = \u00BD(\u0394t/t) = p = e\u207B\u00B3",[0,-R-1.2,0],"#AA3377",20);
  mL(g,"(T \u221D t\u207B\u00B9\u02F2 in radiation era)",[0,-R-1.7,0],"#888888",16);
  // Observer
  mS(g,[0,0,0],0.1,CL.gn,1);
},
desc:'<b>CMB dipole.</b> During the radiation era, T \u221D t\u207B\u00B9\u02F2, so the fractional age gradient maps to a temperature dipole: <b>A = p = e\u207B\u00B3 \u2248 0.049</b>. Planck measures A = 0.066 \u00B1 0.021. The SSM prediction sits at <span class="cg">0.8\u03C3</span> \u2014 a comfortable match. \u039BCDM predicts A = 0, which is <span class="cr">excluded at >3\u03C3</span>.',
eq:'A_predicted = e\u207B\u00B3 \u2248 0.049\nA_observed = 0.066 \u00B1 0.021\n\nTension: 0.8\u03C3\n\n\u039BCDM (A=0): >3\u03C3 excluded'});

// S5: Co-aligned structure dipoles
steps.push({cam:[0,0,14],bg:0xffffff,badge:"FALSIFIABLE TESTS",bc:"#22AA44",
title:"All Structure Dipoles Must Co-Align Along the Same Axis",
build:function(g){
  // Sphere
  var outerGeo2=new THREE.SphereGeometry(R,32,32);
  var outerMat2=new THREE.MeshBasicMaterial({color:CL.gy,transparent:true,opacity:0.04,side:THREE.DoubleSide});
  g.add(new THREE.Mesh(outerGeo2,outerMat2));
  // Axis arrow
  mArrow(g,[-R-1,0,0],[R+1,0,0],CL.rd,0.6);
  mL(g,"THE AXIS",[-R-1.2,0.5,0],"#CC3311",24);
  mL(g,"(l,b) \u2248 (221\u00B0, \u221227\u00B0)",[0,R+1.0,0],"#333333",18);
  // Dipole markers along axis
  var dipoles=[
    {y:1.8,label:"CMB hemispherical asymmetry",col:"#AA3377",status:"A = 0.066 \u00B1 0.021 (Planck)"},
    {y:0.6,label:"Quasar spectral index dipole",col:"#EE7733",status:"(l,b) \u2248 (201\u00B0,\u221229\u00B0) (Sinha 2023)"},
    {y:-0.6,label:"Galaxy cluster maturity gradient",col:"#0077BB",status:"Testable with Euclid"},
    {y:-1.8,label:"BAO scale asymmetry (\u0394r_d \u2248 7 Mpc)",col:"#009988",status:"Testable with DESI (~7\u03C3)"},
  ];
  for(var i=0;i<dipoles.length;i++){
    var d=dipoles[i];
    // Horizontal line at this y
    var lineGeo=new THREE.CylinderGeometry(0.015,0.015,2*R+1,4);
    var lineMat=new THREE.MeshPhongMaterial({color:new THREE.Color(d.col),transparent:true,opacity:0.4});
    var line=new THREE.Mesh(lineGeo,lineMat);
    line.rotation.z=Math.PI/2;line.position.y=d.y;g.add(line);
    mL(g,d.label,[-0.5,d.y+0.3,0],d.col,16);
    mL(g,d.status,[0.5,d.y-0.15,0],"#888888",13);
  }
  mL(g,"All dipoles co-align \u2192 single wavefront confirmed",[0,-R-0.8,0],"#22AA44",20);
  mL(g,"Misalignment falsifies the model",[0,-R-1.3,0],"#CC3311",18);
},
desc:'<b>Falsifiable prediction.</b> If the Big Bang was a single wavefront, then <b>every</b> large-scale structure dipole must align along the same axis: CMB asymmetry, quasar evolution, cluster maturity, BAO scale. Sinha et al. (2023) already found the quasar spectral index dipole co-aligned with the CMB axis. DESI can detect the BAO shift at ~7\u03C3. <b>Any misalignment falsifies the model.</b>',
eq:'All must co-align:\n\u2022 CMB asymmetry \u2713\n\u2022 Quasar evolution \u2713\n\u2022 Cluster maturity ?\n\u2022 BAO \u0394r_d \u2248 7 Mpc ?'});

// RENDER ENGINE
var idx=0,playing=false,pt=null;
var sli=document.querySelector("#sl input");sli.max=steps.length-1;
function clearG(){while(group.children.length){var c=group.children[0];if(c.geometry)c.geometry.dispose();if(c.material){if(Array.isArray(c.material))c.material.forEach(function(m){m.dispose();});else c.material.dispose();}group.remove(c);}group.userData.glows=[];group.userData.wavefront=null;}
function renderStep(i){idx=Math.max(0,Math.min(i,steps.length-1));sli.value=idx;clearG();
var s=steps[idx];s.build(group);
camera.position.set(s.cam[0],s.cam[1],s.cam[2]);camera.lookAt(0,0,0);
scene.background=new THREE.Color(s.bg);rot.y=0;
document.getElementById("badge").textContent=s.badge;document.getElementById("badge").style.background=s.bc;
document.getElementById("title").textContent=s.title;
document.getElementById("desc").innerHTML=s.desc;
document.getElementById("eq").innerHTML=s.eq.replace(/\n/g,'<br>');
document.getElementById("eq").style.display=s.eq?'block':'none';
document.getElementById("fc").textContent=(idx+1)+"/"+steps.length;}

var t=0;
(function anim(){requestAnimationFrame(anim);t+=0.016;
if(ar&&!md)rot.y+=0.002;
group.rotation.x=rot.x;group.rotation.y=rot.y;
if(group.userData.glows)group.userData.glows.forEach(function(gl){gl.material.opacity=0.1+0.08*Math.sin(t*3);gl.scale.setScalar(1+0.08*Math.sin(t*3));});
// Animated wavefront sweep
if(group.userData.wavefront){
  var wf=group.userData.wavefront;
  var sweep=((t*0.15)%1); // 0→1 sweep
  var wx=-R+sweep*2*R;
  wf.position.x=wx;
}
renderer.render(scene,camera);})();

function stp(){playing=false;if(pt)clearTimeout(pt);pt=null;document.getElementById("bp").textContent="\u25B6 Play";document.getElementById("bp").classList.remove("on");}
window.togPlay=function(){if(playing){stp();return;}playing=true;document.getElementById("bp").textContent="\u23F8 Pause";document.getElementById("bp").classList.add("on");function nx(){if(idx>=steps.length-1){stp();return;}renderStep(idx+1);pt=setTimeout(nx,6000);}pt=setTimeout(nx,5000);};
window.goS=function(){stp();renderStep(0);};window.goP=function(){stp();renderStep(idx-1);};
window.goN=function(){stp();renderStep(idx+1);};window.goE=function(){stp();renderStep(steps.length-1);};
window.goTo=function(v){stp();renderStep(v);};
window.togR=function(){ar=!ar;var b=document.getElementById("br");b.textContent="Rot: "+(ar?"ON":"OFF");b.classList.toggle("on",ar);};
window.addEventListener("keydown",function(e){if(e.key==="ArrowRight")goN();else if(e.key==="ArrowLeft")goP();else if(e.key===" "){e.preventDefault();togPlay();}});
renderStep(0);
})();
</script>
</body>
</html>
