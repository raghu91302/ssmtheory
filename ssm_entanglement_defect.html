<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SSM: Matter as a Holographic Entanglement Defect in a K=12 Tensor Network</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;}
html,body{width:100%;height:100%;overflow:hidden;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:#fff;}
#wrap{display:flex;flex-direction:column;width:100%;height:100%;}
#hd{padding:5px 12px;border-bottom:1px solid #ddd;background:#f8f8f8;flex-shrink:0;display:flex;align-items:center;gap:10px;}
#badge{font-size:10px;font-weight:700;color:#fff;padding:2px 8px;border-radius:3px;letter-spacing:0.4px;}
#title{font-size:13px;font-weight:700;color:#222;}
#cv{flex:1;display:block;min-height:0;}
#desc{position:absolute;bottom:46px;left:10px;max-width:420px;background:rgba(255,255,255,0.96);color:#333;padding:9px 13px;border-radius:7px;font-size:11.5px;line-height:1.65;border:1px solid #ddd;pointer-events:none;}
#desc b{color:#111;}
.cb{color:#0077BB;}.cr{color:#CC3311;}.cg{color:#009988;}.co{color:#EE7733;}.cy{color:#996600;}.cp{color:#AA3377;}
#eq{position:absolute;bottom:46px;right:10px;background:rgba(255,255,255,0.96);color:#222;padding:7px 13px;border-radius:7px;font-size:12px;font-family:'Courier New',monospace;border:1px solid #ddd;pointer-events:none;text-align:right;line-height:1.7;}
#ct{flex-shrink:0;padding:5px 10px;background:#f8f8f8;border-top:1px solid #ddd;display:flex;gap:4px;align-items:center;justify-content:center;}
.btn{padding:4px 10px;border:1px solid #ccc;border-radius:3px;background:#fff;color:#555;cursor:pointer;font-size:11px;font-family:inherit;}
.btn.on{border-color:#0077BB;background:#e6f2ff;color:#005588;font-weight:600;}
#sl{flex:1;max-width:350px;margin:0 8px;}
#sl input{width:100%;}
#fc{font-size:10px;color:#888;min-width:40px;text-align:right;}
</style>
</head>
<body>
<div id="wrap">
<div id="hd">
<span id="badge" style="background:#0077BB;">K=12</span>
<div id="title">Loading...</div>
</div>
<div style="flex:1;position:relative;min-height:0;">
<canvas id="cv"></canvas>
<div id="desc"></div>
<div id="eq"></div>
</div>
<div id="ct">
<button class="btn" onclick="goS()">⏮</button>
<button class="btn" onclick="goP()">◀</button>
<button class="btn on" id="bp" onclick="togPlay()">▶ Play</button>
<button class="btn" onclick="goN()">▶</button>
<button class="btn" onclick="goE()">⏭</button>
<div id="sl"><input type="range" min="0" max="0" value="0" oninput="goTo(+this.value)"></div>
<span id="fc">1/12</span>
<button class="btn on" id="br" onclick="togR()">Rot</button>
</div>
</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(function(){"use strict";
var canvas=document.getElementById("cv");
var W,H2,scene,camera,renderer,group;
var rot={x:0.25,y:0},md=false,mx=0,my=0,ar=true;

function init(){var p=canvas.parentElement;W=p.clientWidth;H2=p.clientHeight;canvas.width=W;canvas.height=H2;
scene=new THREE.Scene();scene.background=new THREE.Color(0xffffff);
camera=new THREE.PerspectiveCamera(42,W/H2,0.1,200);
renderer=new THREE.WebGLRenderer({canvas:canvas,antialias:true});renderer.setSize(W,H2);renderer.setPixelRatio(Math.min(window.devicePixelRatio,2));
scene.add(new THREE.AmbientLight(0xffffff,0.5));
var dl=new THREE.DirectionalLight(0xffffff,0.55);dl.position.set(5,8,6);scene.add(dl);
scene.add(new THREE.DirectionalLight(0x8888cc,0.18)).position.set(-4,-3,-5);
group=new THREE.Group();scene.add(group);}
init();

canvas.addEventListener("mousedown",function(e){md=true;mx=e.clientX;my=e.clientY;});
canvas.addEventListener("touchstart",function(e){md=true;mx=e.touches[0].clientX;my=e.touches[0].clientY;},{passive:true});
window.addEventListener("mouseup",function(){md=false;});window.addEventListener("touchend",function(){md=false;});
window.addEventListener("mousemove",function(e){if(!md)return;rot.y+=(e.clientX-mx)*0.005;rot.x+=(e.clientY-my)*0.005;rot.x=Math.max(-1.4,Math.min(1.4,rot.x));mx=e.clientX;my=e.clientY;});
window.addEventListener("touchmove",function(e){if(!md)return;var t=e.touches[0];rot.y+=(t.clientX-mx)*0.005;rot.x+=(t.clientY-my)*0.005;rot.x=Math.max(-1.4,Math.min(1.4,rot.x));mx=t.clientX;my=t.clientY;},{passive:true});
canvas.addEventListener("wheel",function(e){camera.position.z=Math.max(3,Math.min(25,camera.position.z+e.deltaY*0.03));e.preventDefault();},{passive:false});
window.addEventListener("resize",function(){var p=canvas.parentElement;W=p.clientWidth;H2=p.clientHeight;canvas.width=W;canvas.height=H2;camera.aspect=W/H2;camera.updateProjectionMatrix();renderer.setSize(W,H2);});

var C={b:0x0077BB,or:0xEE7733,tl:0x009988,rd:0xCC3311,gn:0x22AA44,wn:0xAA3377,gy:0x999999,lgy:0xcccccc,yl:0xEECC00};
function mS(g,p,r,c,op){var geo=new THREE.SphereGeometry(r,16,16);var m=new THREE.MeshPhongMaterial({color:c,transparent:op<1,opacity:op});var s=new THREE.Mesh(geo,m);s.position.set(p[0],p[1],p[2]);g.add(s);return s;}
function mC(g,a,b,r,c,op){var d=new THREE.Vector3(b[0]-a[0],b[1]-a[1],b[2]-a[2]);var l=d.length();if(l<0.01)return;var mid=new THREE.Vector3((a[0]+b[0])/2,(a[1]+b[1])/2,(a[2]+b[2])/2);var geo=new THREE.CylinderGeometry(r,r,l,6);var m=new THREE.MeshPhongMaterial({color:c,transparent:op<1,opacity:op});var s=new THREE.Mesh(geo,m);s.position.copy(mid);s.quaternion.setFromUnitVectors(new THREE.Vector3(0,1,0),d.normalize());g.add(s);}
function mL(g,t,p,c,sz){var cv2=document.createElement("canvas");cv2.width=640;cv2.height=96;var ctx=cv2.getContext("2d");ctx.font="bold "+(sz||32)+"px -apple-system,sans-serif";ctx.fillStyle=c;ctx.textAlign="center";ctx.textBaseline="middle";ctx.fillText(t,320,48);var tx=new THREE.CanvasTexture(cv2);var s=new THREE.Sprite(new THREE.SpriteMaterial({map:tx,transparent:true}));s.position.set(p[0],p[1],p[2]);s.scale.set(sz?sz*0.055:1.8,sz?sz*0.009:0.28,1);g.add(s);return s;}
function mTri(g,v1,v2,v3,c,op){var geo=new THREE.BufferGeometry();geo.setAttribute("position",new THREE.BufferAttribute(new Float32Array([v1[0],v1[1],v1[2],v2[0],v2[1],v2[2],v3[0],v3[1],v3[2]]),3));geo.computeVertexNormals();g.add(new THREE.Mesh(geo,new THREE.MeshPhongMaterial({color:c,transparent:true,opacity:op,side:THREE.DoubleSide})));}

// === CUBOCTAHEDRON (K=12) ===
var L=3.0; // large scale for visibility
var csc=L/Math.sqrt(2);
var cuboV=[];
var pm=[[0,1],[0,2],[1,2]];
for(var p=0;p<3;p++){var a=pm[p][0],b=pm[p][1];
for(var sa=-1;sa<=1;sa+=2)for(var sb=-1;sb<=1;sb+=2){var v=[0,0,0];v[a]=sa*csc;v[b]=sb*csc;cuboV.push(v);}}
// Classify by y
var si2=[...Array(12).keys()];si2.sort(function(a,b){return cuboV[a][1]-cuboV[b][1];});
var belI=si2.slice(0,3),inI=si2.slice(3,9),abI=si2.slice(9,12);
// Bond threshold
var BL2=L*L*1.1;

// === 8 ENTANGLEMENT VOIDS of the FCC unit cell ===
// In an FCC cell of side a, tet voids at (a/4)(±1,±1,±1)
// For cuboctahedron centered at origin with our scale:
var tetScale=csc; // distance from origin to vertex = csc
// The 8 tet voids: each bounded by 4 of the 12 cuboctahedral vertices
// We compute them from the cuboctahedron vertex positions
// For FCC, tet void centres are at (±1,±1,±1) scaled
var tvS=csc*0.5; // scale for tet void centres
var tetCentres=[];
for(var sx=-1;sx<=1;sx+=2)for(var sy=-1;sy<=1;sy+=2)for(var sz=-1;sz<=1;sz+=2)
  tetCentres.push([sx*tvS,sy*tvS,sz*tvS]);

// For each tet void, find 4 closest cuboctahedral vertices
function dist3(a,b){return Math.sqrt((a[0]-b[0])*(a[0]-b[0])+(a[1]-b[1])*(a[1]-b[1])+(a[2]-b[2])*(a[2]-b[2]));}
var tetVoids=[];
for(var t=0;t<8;t++){
  var dists=cuboV.map(function(v,i){return{i:i,d:dist3(v,tetCentres[t])};});
  dists.sort(function(a,b){return a.d-b.d;});
  tetVoids.push([dists[0].i,dists[1].i,dists[2].i,dists[3].i]);
}

// Pick one void to zoom into (the +++ one)
var mainVoid=tetVoids[7]; // (+,+,+) corner
var TV=[cuboV[mainVoid[0]],cuboV[mainVoid[1]],cuboV[mainVoid[2]],cuboV[mainVoid[3]]];
var TVctr=tetCentres[7];

// Entanglement boundary for zoom steps (all edges = L, centred at origin)
var rts=L/(2*Math.sqrt(2)); // ≈ 1.06 for L=3
var RTV=[[rts,rts,rts],[rts,-rts,-rts],[-rts,rts,-rts],[-rts,-rts,rts]];
var RTVctr=[0,0,0];

// Skew edge pairs of the regular tetrahedron
var skew=[[[RTV[0],RTV[1]],[RTV[2],RTV[3]]],[[RTV[0],RTV[2]],[RTV[1],RTV[3]]],[[RTV[0],RTV[3]],[RTV[1],RTV[2]]]];
var skewC=[C.rd,C.b,C.gn];

// Vertex 0 = corner (d-quark), 1,2,3 = face-centres (u-quarks)
var cornerIdx=0;
var faceIdx=[1,2,3];

// ========== STEPS ==========
var steps=[];

// S0: Full cuboctahedron — K=12 coordination
steps.push({cam:[0,1,11],bg:0xffffff,badge:"K = 12 TENSOR NODE",bc:"#0077BB",
title:"The K=12 Tensor Node: 12 Entanglement Bonds (ebits)",
build:function(g){
  // Central tensor node
  mS(g,[0,0,0],0.25,C.yl,1);
  // 12 surface nodes colored by layer
  for(var i=0;i<12;i++){
    var col=inI.indexOf(i)>=0?C.b:abI.indexOf(i)>=0?C.or:C.tl;
    mS(g,cuboV[i],0.18,col,1);
    mC(g,[0,0,0],cuboV[i],0.04,col,0.5);
  }
  // Surface-surface bonds
  for(var i=0;i<12;i++)for(var j=i+1;j<12;j++){
    var dx=cuboV[i][0]-cuboV[j][0],dy=cuboV[i][1]-cuboV[j][1],dz=cuboV[i][2]-cuboV[j][2];
    if(dx*dx+dy*dy+dz*dz<BL2)mC(g,cuboV[i],cuboV[j],0.02,C.gy,0.2);
  }
  mL(g,"Central tensor node",[0.6,0.5,0],"#CC9900",24);
  mL(g,"6 in-plane + 3 above + 3 below = 12 ebits",[0,3.5,0],"#333333",26);
  mL(g,"K = 12",[0,3.0,0],"#0077BB",34);
},
desc:'<b>The tensor node.</b> Every node in the K=12 FCC tensor network holds 12 entanglement bonds (ebits): <span class="cb">6 in-plane</span> (blue), <span class="co">3 above</span> (orange), <span class="cg">3 below</span> (teal). The <span class="cy">yellow</span> central node is fully entangled. This is the vacuum ground state of the holographic network.',
eq:'K = 12 ebits\n6 + 3 + 3 = 12\n\nFCC tensor network\n= max entanglement'});

// S1: Show the 8 zero-entropy voids
steps.push({cam:[0,1,12],bg:0xffffff,badge:"8 ENTANGLEMENT VOIDS",bc:"#009988",
title:"Inside the Tensor Node: 8 Zero-Entropy Voids",
build:function(g){
  // Surface nodes (dimmed)
  for(var i=0;i<12;i++){
    mS(g,cuboV[i],0.14,C.b,0.35);
  }
  // Surface bonds (faint)
  for(var i=0;i<12;i++)for(var j=i+1;j<12;j++){
    var dx=cuboV[i][0]-cuboV[j][0],dy=cuboV[i][1]-cuboV[j][1],dz=cuboV[i][2]-cuboV[j][2];
    if(dx*dx+dy*dy+dz*dz<BL2)mC(g,cuboV[i],cuboV[j],0.012,C.lgy,0.12);
  }
  // 8 zero-entropy voids — show each as transparent tetrahedron
  var tetColors=[C.tl,C.or,C.b,C.gn,C.wn,C.rd,C.yl,C.tl];
  for(var t=0;t<8;t++){
    var vi=tetVoids[t];
    var v0=cuboV[vi[0]],v1=cuboV[vi[1]],v2=cuboV[vi[2]],v3=cuboV[vi[3]];
    var cc=tetColors[t%tetColors.length];
    mTri(g,v0,v1,v2,cc,0.1);mTri(g,v0,v1,v3,cc,0.1);
    mTri(g,v0,v2,v3,cc,0.1);mTri(g,v1,v2,v3,cc,0.1);
    // Void centre dot
    mS(g,tetCentres[t],0.06,cc,0.7);
  }
  // Highlight the main void
  var vi=mainVoid;
  var v0=cuboV[vi[0]],v1=cuboV[vi[1]],v2=cuboV[vi[2]],v3=cuboV[vi[3]];
  mTri(g,v0,v1,v2,C.rd,0.25);mTri(g,v0,v1,v3,C.rd,0.25);
  mTri(g,v0,v2,v3,C.rd,0.25);mTri(g,v1,v2,v3,C.rd,0.25);
  mS(g,TVctr,0.1,C.rd,1);

  mL(g,"8 zero-entropy voids",[0,3.5,0],"#009988",30);
  mL(g,"hidden inside every tensor node",[0,3.0,0],"#666666",22);
  mL(g,"\u2190 this one",[TVctr[0]+0.6,TVctr[1]+0.3,TVctr[2]],"#CC3311",22);
},
desc:'<b>8 zero-entropy voids.</b> The space between the 12 entanglement bonds contains exactly <b>8 tetrahedral pockets</b>, each bounded by 4 tensor nodes. Each empty void has <b>S = 0 ebits</b> crossing its boundary2014zero entanglement entropy. The highlighted void (<span class="cr">red</span>) is where a defect will form.',
eq:'Empty void: S = 0\n(no bonds cross boundary)\n\n8 voids per node\n4 bounding atoms each'});

// S2: Zoom into the chosen void — empty
steps.push({cam:[RTVctr[0],RTVctr[1]+0.5,RTVctr[2]+6],bg:0xffffff,badge:"S = 0 VOID",bc:"#009988",
title:"Zooming In: One Zero-Entropy Void (S = 0)",
build:function(g){
  // The 4 bounding vertices — large
  mS(g,RTV[0],0.2,C.tl,1); mS(g,RTV[1],0.2,C.tl,1);
  mS(g,RTV[2],0.2,C.tl,1); mS(g,RTV[3],0.2,C.tl,1);
  // 6 edges
  for(var i=0;i<4;i++)for(var j=i+1;j<4;j++)mC(g,RTV[i],RTV[j],0.03,C.tl,0.4);
  // Faces
  mTri(g,RTV[0],RTV[1],RTV[2],C.tl,0.07);mTri(g,RTV[0],RTV[1],RTV[3],C.tl,0.07);
  mTri(g,RTV[0],RTV[2],RTV[3],C.tl,0.07);mTri(g,RTV[1],RTV[2],RTV[3],C.tl,0.07);
  // Centre marker
  mS(g,RTVctr,0.06,C.gy,0.3);
  // Labels
  mL(g,"Vertex A",[RTV[0][0]-0.6,RTV[0][1]-0.3,RTV[0][2]],"#009988",22);
  mL(g,"B",[RTV[1][0]+0.4,RTV[1][1]+0.2,RTV[1][2]],"#009988",22);
  mL(g,"C",[RTV[2][0]+0.4,RTV[2][1]-0.2,RTV[2][2]],"#009988",22);
  mL(g,"D",[RTV[3][0]-0.4,RTV[3][1]+0.3,RTV[3][2]],"#009988",22);
  mL(g,"S = 0 (no bonds cross boundary)",[RTVctr[0]+0.8,RTVctr[1],RTVctr[2]],"#888888",18);
  mL(g,"Entanglement boundary",[RTVctr[0],RTVctr[1]+2.0,RTVctr[2]],"#009988",28);
  mL(g,"each ebit = fundamental length L",[RTVctr[0],RTVctr[1]+1.6,RTVctr[2]],"#666666",20);
},
desc:'<b>Zoom in.</b> Four tensor nodes form the boundary of this void. All 6 entanglement bonds between them equal the fundamental length L. No node sits inside — no bonds cross the boundary → <b>S = 0 ebits</b>. This is where the entanglement defect will form.',
eq:'4 bounding nodes\n6 inter-node ebits\n\nS_void = 0\n(no bonds cross boundary)'});

// S3: Extra node appears
steps.push({cam:[RTVctr[0],RTVctr[1]+0.5,RTVctr[2]+6],bg:0xffffff,badge:"THE ENTANGLEMENT DEFECT",bc:"#CC3311",
title:"Entanglement Defect: An Interstitial Node Creates S = 4 ebits",
build:function(g){
  // Bounding vertices
  mS(g,RTV[0],0.18,C.tl,0.7);mS(g,RTV[1],0.18,C.tl,0.7);
  mS(g,RTV[2],0.18,C.tl,0.7);mS(g,RTV[3],0.18,C.tl,0.7);
  // Tet edges (dimmed)
  for(var i=0;i<4;i++)for(var j=i+1;j<4;j++)mC(g,RTV[i],RTV[j],0.02,C.tl,0.2);
  // THE ENTANGLEMENT DEFECT — big, red, pulsing
  mS(g,RTVctr,0.28,C.rd,1);
  var gg=new THREE.SphereGeometry(0.4,16,16);
  var gm=new THREE.MeshBasicMaterial({color:C.rd,transparent:true,opacity:0.12});
  var glow=new THREE.Mesh(gg,gm);glow.position.set(RTVctr[0],RTVctr[1],RTVctr[2]);g.add(glow);
  g.userData.glows=[glow];
  // 4 bonds from extra node to vertices
  for(var i=0;i<4;i++)mC(g,RTVctr,RTV[i],0.05,C.rd,0.85);
  mL(g,"INTERSTITIAL NODE",[RTVctr[0],RTVctr[1]+0.7,RTVctr[2]],"#CC3311",30);
  mL(g,"S = 4 ebits",[RTVctr[0],RTVctr[1]-0.65,RTVctr[2]],"#CC3311",24);
  mL(g,"4 entanglement bonds cross the void boundary",[RTVctr[0],RTVctr[1]+2.2,RTVctr[2]],"#333333",24);
  mL(g,"\u0394S = 4 \u2212 0 = 4 ebits of excess entanglement",[RTVctr[0],RTVctr[1]+1.75,RTVctr[2]],"#CC3311",22);
},
desc:'<b>The entanglement defect.</b> An interstitial node sits at the void centre, bonded to all 4 bounding nodes. This introduces <span class="cr">4 entanglement bonds (ebits)</span> crossing the void boundary where previously there were none. The excess entanglement entropy: <b>\u0394S = 4 \u2212 0 = 4 ebits</b>. This is matter \u2014 a localized entanglement excess in the tensor network.',
eq:'S_void = 0 (empty)\nS_defect = 4 (occupied)\n\n\u0394S = 4 ebits\n\nA_defect = 16 l\u00B2_P'});

// S4: 1+3 charges
steps.push({cam:[RTVctr[0],RTVctr[1]+0.5,RTVctr[2]+6],bg:0xffffff,badge:"ENTANGLEMENT ASYMMETRY",bc:"#EE7733",
title:"The 1+3 Splitting: Fractional Charge from Entanglement Asymmetry",
build:function(g){
  // Corner vertex (d-quark) — GREEN, larger
  mS(g,RTV[cornerIdx],0.22,C.gn,1);
  // Face-centre vertices (u-quarks) — ORANGE
  for(var i=0;i<3;i++)mS(g,RTV[faceIdx[i]],0.22,C.or,1);
  // Extra node (smaller now)
  mS(g,RTVctr,0.15,C.gy,0.5);
  // Bonds: corner to face-centres (grey, symmetric)
  for(var i=0;i<3;i++)mC(g,RTV[cornerIdx],RTV[faceIdx[i]],0.025,C.gy,0.35);
  // Bonds: face-centre to face-centre (orange, asymmetric majority)
  for(var i=0;i<3;i++)for(var j=i+1;j<3;j++)mC(g,RTV[faceIdx[i]],RTV[faceIdx[j]],0.035,C.or,0.5);
  // Labels
  mL(g,"d-quark (\u22121/3)",[RTV[cornerIdx][0]-0.8,RTV[cornerIdx][1]-0.35,RTV[cornerIdx][2]],"#22AA44",26);
  mL(g,"3 identical bonds",[RTV[cornerIdx][0]-0.8,RTV[cornerIdx][1]-0.7,RTV[cornerIdx][2]],"#888888",18);
  for(var i=0;i<3;i++){
    var off=i===0?[0.7,0.3,0]:i===1?[0.7,-0.3,0]:[-0.7,0.35,0];
    mL(g,"u (+2/3)",[RTV[faceIdx[i]][0]+off[0],RTV[faceIdx[i]][1]+off[1],RTV[faceIdx[i]][2]+off[2]],"#EE7733",22);
  }
  mL(g,"1+2 bond asymmetry",[RTV[faceIdx[0]][0]+0.7,RTV[faceIdx[0]][1]-0.1,RTV[faceIdx[0]][2]],"#888888",16);
  mL(g,"PROTON: uud \u2192 +2/3 +2/3 \u22121/3 = +1",[RTVctr[0],RTVctr[1]+2.3,RTVctr[2]],"#333333",26);
},
desc:'<b>Entanglement asymmetry.</b> O<sub>h</sub> \u2229 T<sub>d</sub> splits the 4 bounding nodes into <b>1 corner</b> (<span class="cg">green</span>) and <b>3 face-centres</b> (<span class="co">orange</span>). Corner: 3 identical entanglement bonds \u2192 zero distinguishability \u2192 charge <b>\u22121/3</b>. Face-centre: 1 distinct + 2 equivalent bonds \u2192 majority channel \u2192 charge <b>+2/3</b>. Charge = fraction of entanglement pattern distinguishable by the EM (bipartite) sector.',
eq:'Corner: 3/3 \u2192 \u22121/3 (d)\nFace-ctr: 2/3 \u2192 +2/3 (u)\n\nProton = uud = +1\nNeutron = udd = 0\n\u0394++ = uuu = +2'});

// S5: Three colors
steps.push({cam:[RTVctr[0],RTVctr[1]+0.5,RTVctr[2]+6],bg:0xffffff,badge:"THREE ENTANGLEMENT CROSSINGS",bc:"#AA3377",
title:"Three Colors from Three Entanglement Crossing Pairs",

// === FCC LATTICE CHAIN: Edge-sharing tetrahedra, no gaps ===
// Adjacent FCC tet voids share 2 bounding atoms (1 edge).
// Opposite edges of a regular tet are perpendicular, separated by L/√2.
// Chain: shared edges alternate between z-dir and y-dir, stepping along x by L/√2.
var chainL=1.5, chainD=chainL/Math.sqrt(2), chainHL=chainL/2;

function buildFCCChain(g,nVoids,startType){
  // Generate all nodes: 2 per shared-edge boundary, (nVoids+1) boundaries
  var nodes=[];
  for(var i=0;i<=nVoids;i++){
    var x=i*chainD;
    if(i%2===0){nodes.push([x,0,-chainHL]);nodes.push([x,0,chainHL]);}
    else{nodes.push([x,-chainHL,0]);nodes.push([x,chainHL,0]);}
  }
  // Centre on origin
  var ox=nVoids*chainD/2;
  for(var i=0;i<nodes.length;i++)nodes[i][0]-=ox;

  // Build tet index list
  var tets=[];
  for(var i=0;i<nVoids;i++)tets.push([i*2,i*2+1,(i+1)*2,(i+1)*2+1]);

  // Draw ALL lattice atoms
  for(var i=0;i<nodes.length;i++)mS(g,nodes[i],0.07,C.gy,0.7);

  // Draw ALL bonds between pairs within each tet (6 bonds per tet, shared edges drawn once)
  var drawnBonds={};
  for(var t=0;t<tets.length;t++){
    var ti=tets[t];
    for(var a2=0;a2<4;a2++)for(var b2=a2+1;b2<4;b2++){
      var key=Math.min(ti[a2],ti[b2])+"_"+Math.max(ti[a2],ti[b2]);
      if(!drawnBonds[key]){drawnBonds[key]=1;mC(g,nodes[ti[a2]],nodes[ti[b2]],0.018,C.lgy,0.35);}
    }
  }

  // Stub bonds at each end to suggest lattice continues
  var stubLen=0.6;
  var endNodes=[0,1,nodes.length-2,nodes.length-1];
  for(var e=0;e<endNodes.length;e++){
    var ni=endNodes[e];var n=nodes[ni];
    var dir=ni<2?-1:1;
    var stub=[n[0]+dir*stubLen,n[1],n[2]];
    mC(g,n,stub,0.01,C.lgy,0.15);mS(g,stub,0.04,C.lgy,0.2);
  }

  // Draw tet void volumes and collect void centres
  var voids=[];
  for(var t=0;t<tets.length;t++){
    var ti=tets[t];
    var isP=(t%2===(startType==='P'?0:1));
    var col=isP?C.rd:C.b;
    var v=[nodes[ti[0]],nodes[ti[1]],nodes[ti[2]],nodes[ti[3]]];
    // Transparent faces
    mTri(g,v[0],v[1],v[2],col,0.08);mTri(g,v[0],v[1],v[3],col,0.08);
    mTri(g,v[0],v[2],v[3],col,0.08);mTri(g,v[1],v[2],v[3],col,0.08);
    // Void centre
    var ctr=[(v[0][0]+v[1][0]+v[2][0]+v[3][0])/4,
             (v[0][1]+v[1][1]+v[2][1]+v[3][1])/4,
             (v[0][2]+v[1][2]+v[2][2]+v[3][2])/4];
    // P/N label
    var lcol=isP?"#CC3311":"#0077BB";
    mL(g,isP?"P":"N",[ctr[0],ctr[1]+(isP?0.55:-0.55),ctr[2]],lcol,20);
    voids.push({cx:ctr[0],cy:ctr[1],cz:ctr[2],isP:isP});
  }
  return voids;
}

  if(ease>0.5)inP=h.voids[toIdx].isP;
  h.mesh.material.color.setHex(inP?C.rd:C.b);
  if(h.glow)h.glow.material.color.setHex(inP?C.rd:C.b);
});
// Annihilation drift animation — 3D
if(group.userData.annihilate){
  var an=group.userData.annihilate;
  an.phase=(an.phase+0.008)%1;
  var drift=an.phase*0.7;
  var midx=(an.px+an.nx)/2,midy=(an.py+an.ny)/2,midz=(an.pz+an.nz)/2;
  an.part.position.set(an.px+(midx-an.px)*drift,an.py+(midy-an.py)*drift,an.pz+(midz-an.pz)*drift);
  an.anti.position.set(an.nx+(midx-an.nx)*drift,an.ny+(midy-an.ny)*drift,an.nz+(midz-an.nz)*drift);
  if(an.gl1){an.gl1.position.copy(an.part.position);an.gl2.position.copy(an.anti.position);}
  if(an.phase>0.85){
    var flash=1-(an.phase-0.85)/0.15;
    an.part.material.opacity=flash;an.anti.material.opacity=flash;
    an.part.scale.setScalar(1+(1-flash)*2);an.anti.scale.setScalar(1+(1-flash)*2);
  } else {an.part.material.opacity=0.99;an.anti.material.opacity=0.99;an.part.scale.setScalar(1);an.anti.scale.setScalar(1);}
}
renderer.render(scene,camera);})();

function stp(){playing=false;if(pt)clearTimeout(pt);pt=null;document.getElementById("bp").textContent="\u25B6 Play";document.getElementById("bp").classList.remove("on");}
window.togPlay=function(){if(playing){stp();return;}playing=true;document.getElementById("bp").textContent="\u23F8 Pause";document.getElementById("bp").classList.add("on");function nx(){if(idx>=steps.length-1){stp();return;}renderStep(idx+1);pt=setTimeout(nx,5000);}pt=setTimeout(nx,4500);};
window.goS=function(){stp();renderStep(0);};window.goP=function(){stp();renderStep(idx-1);};
window.goN=function(){stp();renderStep(idx+1);};window.goE=function(){stp();renderStep(steps.length-1);};
window.goTo=function(v){stp();renderStep(v);};
window.togR=function(){ar=!ar;var b=document.getElementById("br");b.textContent="Rot: "+(ar?"ON":"OFF");b.classList.toggle("on",ar);};
window.addEventListener("keydown",function(e){if(e.key==="ArrowRight")goN();else if(e.key==="ArrowLeft")goP();else if(e.key===" "){e.preventDefault();togPlay();}});
renderStep(0);
})();
</script>
