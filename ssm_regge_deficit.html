function mS(p,r,c){var g=new THREE.SphereGeometry(r,10,10);var m=new THREE.MeshPhongMaterial({color:c});var s=new THREE.Mesh(g,m);s.position.copy(p);return s;}
function mC(p1,p2,r,c,op){var d=new THREE.Vector3().subVectors(p2,p1);var l=d.length();if(l<0.001)return new THREE.Group();var mid=new THREE.Vector3().addVectors(p1,p2).multiplyScalar(0.5);var g=new THREE.CylinderGeometry(r,r,l,6);var m=new THREE.MeshPhongMaterial({color:c,transparent:op<1,opacity:op});var s=new THREE.Mesh(g,m);s.position.copy(mid);s.quaternion.setFromUnitVectors(new THREE.Vector3(0,1,0),d.normalize());return s;}

function hexN(rad){var ns=[];for(var q=-rad;q<=rad;q++)for(var r=-rad;r<=rad;r++){if(Math.abs(q+r)>rad)continue;ns.push([q*L+r*L/2,0,r*LH]);}return ns;}

},ph:"k6",badge:"STITCH: HEX RING",bc:"#009988",label:"Stitching Continues: Hexagonal Ring Forming",

tl:'<b>You are here:</b><br>\u25B6 <b style="color:#009988">Stitching (hex ring)</b><br>\u00A0\u00A0 K=6 Sheet<br>\u00A0\u00A0 K=4 Frustrated Foam<br>\u00A0\u00A0 K=12 Vacuum'});
// S0: K=6 sheet
steps.push({b:function(g){for(var i=0;i<bs3.length;i++)g.add(mC(new THREE.Vector3(ns3[bs3[i][0]][0],0,ns3[bs3[i][0]][2]),new THREE.Vector3(ns3[bs3[i][1]][0],0,ns3[bs3[i][1]][2]),0.025,C.tl,0.6));for(var k=0;k<ns3.length;k++)g.add(mS(new THREE.Vector3(ns3[k][0],0,ns3[k][2]),0.06,C.tl));g.add(mL("K = 6  —  Perfectly Flat",new THREE.Vector3(0,0.7,0),"#009988"));},ph:"k6",badge:"K = 6  GROUND STATE",bc:"#009988",label:"Phase I: The 2D Hexagonal Ground State",desc:"The pre-bulk vacuum. A flat hexagonal sheet with K=6. Each interior node has degree 6 \u2014 the maximum coordination consistent with strict planarity. The Stitch operator has saturated the 2D plane.",legend:'<div class="lt">Phase I: K = 6</div>Flat hexagonal sheet.<br>Maximum 2D coordination.<br><br>No 3D volume exists yet.',tl:'<b>You are here:</b><br>\u25B6 <b style="color:#009988">K=6 Ground State</b><br>\u00A0\u00A0 K=4 Frustrated Foam<br>\u00A0\u00A0 K=12 Vacuum'});
